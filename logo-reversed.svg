<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80" role="img">
  <title>Araf Systems — reversed logo (for dark backgrounds)</title>
  <desc>Teal badge with mountain peaks and white ARAF SYSTEMS wordmark for dark backgrounds</desc>
  <defs>
    <clipPath id="c">
      <rect x="0" y="0" width="80" height="80" rx="14"/>
    </clipPath>
  </defs>
  <!-- Badge -->
  <rect width="80" height="80" rx="14" fill="#00B4A6"/>
  <g clip-path="url(#c)">
    <polygon points="6,80 40,30 74,80"  fill="#008C81"/>
    <polygon points="-2,80 24,40 50,80" fill="#009E91"/>
    <polygon points="18,80 40,16 62,80" fill="#FFFFFF" opacity="0.95"/>
    <polygon points="32,80 56,36 80,80" fill="#009E91"/>
    <rect x="0" y="70" width="80" height="10" fill="#007A70"/>
  </g>
  <!-- Wordmark white -->
  <text x="96" y="46"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="32" letter-spacing="2"
        fill="#FFFFFF">ARAF</text>
  <text x="96" y="72"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="32" letter-spacing="2"
        fill="#00B4A6">SYSTEMS</text>
</svg>
