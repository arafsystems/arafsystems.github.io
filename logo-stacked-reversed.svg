<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170" width="220" height="170" role="img">
  <title>Araf Systems — stacked logo reversed</title>
  <desc>Teal icon badge centered above white ARAF and teal SYSTEMS wordmark — for dark backgrounds</desc>
  <defs>
    <clipPath id="c">
      <rect x="0" y="0" width="80" height="80" rx="14"/>
    </clipPath>
  </defs>
  <g transform="translate(70, 0)">
    <rect width="80" height="80" rx="14" fill="#00B4A6"/>
    <g clip-path="url(#c)">
      <polygon points="6,80 40,30 74,80"  fill="#008C81"/>
      <polygon points="-2,80 24,40 50,80" fill="#009E91"/>
      <polygon points="18,80 40,16 62,80" fill="#FFFFFF" opacity="0.95"/>
      <polygon points="32,80 56,36 80,80" fill="#009E91"/>
      <rect x="0" y="70" width="80" height="10" fill="#007A70"/>
    </g>
  </g>
  <text x="110" y="116"
        text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="30" letter-spacing="4"
        fill="#FFFFFF">ARAF</text>
  <text x="110" y="148"
        text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="30" letter-spacing="4"
        fill="#00B4A6">SYSTEMS</text>
  <text x="110" y="165"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="9" letter-spacing="4"
        fill="rgba(255,255,255,0.35)">TECHNOLOGY CONSULTING</text>
</svg>
